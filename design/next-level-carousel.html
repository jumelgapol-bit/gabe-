<!--
  ================================================================
  LAYLA'S DANCEWEAR — "NEXT LEVEL" image carousel  (enhanced, text-free)
  ----------------------------------------------------------------
  A refined, premium replacement for the existing Owl/Magezon
  "NEXT LEVEL" image slider. IMAGES ONLY — no headings, labels or
  captions. Portrait cards with a soft gold hairline, gentle hover
  zoom + lift, classic circular arrows and a thin progress rail.
  Tokens match the site (bone / noir / champagne gold).

  DROP-IN NOTES
  • Fully self-contained — no jQuery / Owl dependency required.
  • Everything is scoped under ".nlx" so it won't collide with
    existing Magento / Magezon styles.
  • To feed it from Magezon instead of the static markup below,
    keep the outer ".nlx" wrapper and render each slide as:
        <a class="nlx-card" href="{link}"><img src="{image}" alt="" loading="lazy"></a>
    The JS auto-detects however many .nlx-card children exist.
  ================================================================
-->
<section class="nlx" aria-label="Next Level dance costumes">

  <style>
  /* ---------- tokens (self-contained, mirror the site) ---------- */
  .nlx{
    --nl-bone:#F5EFE7; --nl-bone2:#EDE4D8; --nl-ink:#15100F;
    --nl-gold:#C6A15B; --nl-gold-lt:#E6CD97;
    --nl-line:#E3D8CA;
    --nl-e:cubic-bezier(.19,1,.22,1);
    position:relative; background:var(--nl-bone);
    padding:clamp(3rem,6vw,5.5rem) 0;
    -webkit-font-smoothing:antialiased;
  }
  .nlx *,.nlx *::before,.nlx *::after{box-sizing:border-box;margin:0;padding:0}
  .nlx img{display:block;max-width:100%}
  .nlx a{text-decoration:none;color:inherit}
  .nlx-wrap{max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}

  /* ---------- viewport / track ---------- */
  .nlx-viewport{overflow:hidden;margin:0 -12px;cursor:grab}
  .nlx-viewport.is-drag{cursor:grabbing}
  .nlx-track{display:flex;will-change:transform;transition:transform .7s var(--nl-e)}
  .nlx-track.no-anim{transition:none}
  .nlx-slide{flex:0 0 auto;width:25%;padding:0 12px}

  /* ---------- card (image only) ---------- */
  .nlx-card{
    position:relative;display:block;overflow:hidden;border-radius:10px;
    background:var(--nl-bone2);isolation:isolate;
    box-shadow:0 1px 0 rgba(255,255,255,.6),0 18px 34px -22px rgba(21,16,15,.42);
    transition:transform .55s var(--nl-e),box-shadow .55s var(--nl-e);
  }
  .nlx-card::after{ /* soft gold hairline frame */
    content:"";position:absolute;inset:0;z-index:3;border-radius:10px;
    border:1px solid rgba(198,161,91,.32);pointer-events:none;
    transition:border-color .55s var(--nl-e);
  }
  .nlx-card__media{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:10px}
  .nlx-card__media img{
    width:100%;height:100%;object-fit:cover;
    transform:scale(1.02);transition:transform 1.1s var(--nl-e),filter .55s var(--nl-e);
    filter:saturate(.96);
  }
  .nlx-card:hover{transform:translateY(-6px);box-shadow:0 1px 0 rgba(255,255,255,.6),0 30px 46px -24px rgba(21,16,15,.5)}
  .nlx-card:hover::after{border-color:rgba(198,161,91,.6)}
  .nlx-card:hover img{transform:scale(1.08);filter:saturate(1.04)}

  /* ---------- controls (icons only, no text) ---------- */
  .nlx-controls{display:flex;align-items:center;gap:1.4rem;margin-top:clamp(1.4rem,2.6vw,2.1rem)}
  .nlx-rail{position:relative;flex:1;height:1px;background:var(--nl-line);overflow:hidden}
  .nlx-rail__bar{
    position:absolute;left:0;top:0;height:100%;width:20%;
    background:linear-gradient(90deg,var(--nl-gold),var(--nl-gold-lt));
    transition:left .7s var(--nl-e),width .7s var(--nl-e);
  }
  .nlx-nav{display:flex;gap:.6rem}
  .nlx-arrow{
    width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
    color:var(--nl-ink);border:1px solid var(--nl-line);background:transparent;
    cursor:pointer;position:relative;isolation:isolate;overflow:hidden;
    transition:color .45s var(--nl-e),border-color .45s var(--nl-e);
  }
  .nlx-arrow::before{
    content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;
    background:linear-gradient(120deg,var(--nl-gold),var(--nl-gold-lt));
    transform:scale(0);transition:transform .45s var(--nl-e);
  }
  .nlx-arrow:hover{color:#fff;border-color:transparent}
  .nlx-arrow:hover::before{transform:scale(1)}
  .nlx-arrow svg{position:relative;z-index:1}

  /* ---------- responsive ---------- */
  @media (max-width:1024px){ .nlx-slide{width:33.333%} }
  @media (max-width:720px){ .nlx-slide{width:50%} }
  @media (max-width:480px){ .nlx-slide{width:82%} }
  @media (prefers-reduced-motion:reduce){
    .nlx-track,.nlx-card,.nlx-card img,.nlx-rail__bar{transition:none}
  }
  </style>

  <div class="nlx-wrap">

    <div class="nlx-viewport" id="nlxViewport">
      <div class="nlx-track" id="nlxTrack">

        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/6a-597A8545_copy.jpg" alt="" loading="lazy"></div>
        </a>
        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/7a-597A7533_copy.jpg" alt="" loading="lazy"></div>
        </a>
        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/8a-597A8806_copy.jpg" alt="" loading="lazy"></div>
        </a>
        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/9a-597A8161_copy.jpg" alt="" loading="lazy"></div>
        </a>
        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/10a-597A7706_copy.jpg" alt="" loading="lazy"></div>
        </a>
        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/1a-597A7889_copy.jpg" alt="" loading="lazy"></div>
        </a>
        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/2a-597A8598_copy.jpg" alt="" loading="lazy"></div>
        </a>
        <a class="nlx-card" href="https://laylasdance.com/costumes/next-level-dance-costumes.html">
          <div class="nlx-card__media"><img src="https://laylasdance.com/media/catalog/category/5a-L3856_copy.jpg" alt="" loading="lazy"></div>
        </a>

      </div>
    </div>

    <div class="nlx-controls">
      <div class="nlx-rail"><span class="nlx-rail__bar" id="nlxBar"></span></div>
      <div class="nlx-nav">
        <button class="nlx-arrow" id="nlxPrev" aria-label="Previous">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M16 6H2M7 1L2 6l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nlx-arrow" id="nlxNext" aria-label="Next">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M1 6h14M10 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

  </div>

  <script>
  (function(){
    var vp=document.getElementById('nlxViewport');
    var track=document.getElementById('nlxTrack');
    var slides=[].slice.call(track.querySelectorAll('.nlx-card'));
    var prev=document.getElementById('nlxPrev'), next=document.getElementById('nlxNext');
    var bar=document.getElementById('nlxBar');
    if(!slides.length) return;
    slides.forEach(function(s){s.classList.add('nlx-slide');});

    var index=0, autoTimer=null;
    function perView(){var w=innerWidth; if(w<=480)return 1; if(w<=720)return 2; if(w<=1024)return 3; return 4;}
    function maxIndex(){return Math.max(0, slides.length-perView());}

    function go(i,anim){
      index=Math.max(0,Math.min(i,maxIndex()));
      var step=slides[0].getBoundingClientRect().width;
      if(anim===false) track.classList.add('no-anim'); else track.classList.remove('no-anim');
      track.style.transform='translate3d('+(-index*step)+'px,0,0)';
      if(anim===false){ track.offsetHeight; track.classList.remove('no-anim'); }
      var pv=perView(), total=slides.length;
      bar.style.width=Math.min(100,(pv/total)*100)+'%';
      bar.style.left=(index/total)*100+'%';
    }
    function nextSlide(){ index>=maxIndex()?go(0):go(index+1); }
    function prevSlide(){ index<=0?go(maxIndex()):go(index-1); }

    next.addEventListener('click',function(){nextSlide();restart();});
    prev.addEventListener('click',function(){prevSlide();restart();});

    /* drag / swipe */
    var down=false,startX=0,curX=0,base=0;
    function xOf(e){return e.touches?e.touches[0].clientX:e.clientX;}
    vp.addEventListener('pointerdown',function(e){down=true;startX=curX=xOf(e);var m=/translate3d\((-?\d+\.?\d*)px/.exec(track.style.transform);base=m?parseFloat(m[1]):0;vp.classList.add('is-drag');track.classList.add('no-anim');});
    window.addEventListener('pointermove',function(e){if(!down)return;curX=xOf(e);track.style.transform='translate3d('+(base+(curX-startX))+'px,0,0)';});
    window.addEventListener('pointerup',function(){if(!down)return;down=false;vp.classList.remove('is-drag');track.classList.remove('no-anim');var dx=curX-startX;var step=slides[0].getBoundingClientRect().width;if(Math.abs(dx)>step*0.18){dx<0?nextSlide():prevSlide();}else{go(index);}restart();});

    /* gentle autoplay, pauses on hover */
    function restart(){clearInterval(autoTimer);autoTimer=setInterval(nextSlide,5200);}
    vp.addEventListener('mouseenter',function(){clearInterval(autoTimer);});
    vp.addEventListener('mouseleave',restart);

    var rt; addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){go(index,false);},150);});
    go(0,false); restart();
  })();
  </script>
</section>
